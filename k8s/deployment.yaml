apiVersion: apps/v1
kind: Deployment

metadata:
  name: adapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: adapp

  template:
    metadata:
      labels:
        app: adapp

    spec:
      containers:
      - name: adapp
        image: adapp:v1
        imagePullPolicy: Never

        ports:
        - containerPort: 3000