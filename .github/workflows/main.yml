name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Docker Image
        run: docker build -t aamitdevops/node-app:${{ github.sha }} .

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aamitdevops/node-app:${{ github.sha }}
          format: table
          exit-code: 0

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: |
          docker tag aamitdevops/node-app:${{ github.sha }} aamitdevops/node-app:latest
          docker push aamitdevops/node-app:${{ github.sha }}
          docker push aamitdevops/node-app:latest

      - name: Validate Kubernetes Manifests
        run: |
          kubectl apply --dry-run=client -f k8s/